[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-semester-assignment"
version = "1.0.0"
description = "Teknikat e kërkimit të painformuar — 2026/27"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8,<4", "networkx>=3.2,<4", "graphviz>=0.20,<1", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
